[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "numprint"
version = "1.2.0"
description = "Tiny dependency-free helpers for multiplication tables and parity checks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["math", "tables", "parity", "utils"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Hritik0os/numprint"

[project.scripts]
numprint = "numprint.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["numprint"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]